name: Build Atlas container
# Builds the upstream source with the Unraid persistence wrapper.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docker.yml
      - docker/**
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/atlas-unraid
  UPSTREAM_REPOSITORY: Eraxty/Atlas
  UPSTREAM_REF: v5.1.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v5

      - name: Check out upstream release
        id: upstream
        shell: bash
        run: |
          git clone --filter=blob:none --branch "$UPSTREAM_REF" \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" upstream
          sha="$(git -C upstream rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this upstream commit is already published
        id: image
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${IMAGE_NAME}:upstream-${{ steps.upstream.outputs.short_sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare upstream source
        if: steps.image.outputs.exists != 'true'
        shell: bash
        run: |
          git -C upstream apply ../docker/atlas-config.patch
          cp docker/Dockerfile upstream/Dockerfile.unraid
          cp docker/entrypoint.sh upstream/unraid-entrypoint.sh
      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          file: ./upstream/Dockerfile.unraid
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v5.1.1
            ${{ env.IMAGE_NAME }}:upstream-${{ steps.upstream.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Atlas
            org.opencontainers.image.description=Self-hosted Usenet indexer packaged for Unraid
            org.opencontainers.image.source=https://github.com/Eraxty/Atlas
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
